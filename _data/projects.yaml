- title: Salton Sea microbial ecology
  subtitle: At the intersection of public health and environmental research
  image: images/temperature_stations.png
  description: The Salton Sea is a large, hypersaline lake (CA) with impaired water quality. Via biogeochemical models and ongoing measurements, we are studying ecological dynamics that contribute to public health hazards
  tags:
    - project

- title: Multiscale modeling
  subtitle: Linking genome-scale to the water column
  image: images/diatom.png
  description: Work in collaboration with the C-CoMP NSF STC to develop a coupling between a genome-scale metabolic model (GEM/FBA) and a 1-D water column biogeochemical model and hence link complex biology to oceanographic dynamics
  tags:
    - software
    - project


- title: Intraspecific diversity
  subtitle: Coccolithophores and beyond
  image: images/ele70055-fig-0001-m.jpg
  link: https://onlinelibrary.wiley.com/doi/10.1111/ele.70055
  description: Studying intraspecific diversity in important phytoplankton groups can be used as a proxy for current model-relevant diversity & future capacity for resilience to changing environmental conditions
  tags:
    - project

