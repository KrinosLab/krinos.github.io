- title: Time series gene expression data for coastal phytoplankton dynamics
  subtitle: Water quality monitoring at high throughput
  group: featured
  image: images/fixed_n_p_corr_fig.png
  link: https://www.biorxiv.org/content/10.64898/2026.01.13.699386v1.abstract
